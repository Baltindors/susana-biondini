# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Baltindors/susana-biondini
  branch: main

media_folder: /public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Escritos
    label_singular: Escrito
    folder: /src/content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Fecha de publicación, name: date, widget: datetime }
      - { label: Descripción, name: description, widget: text }
      - { label: "Audio MP3", name: audio, widget: file, required: false }
      - { label: "Marcas de tiempo del audio (.vtt)", name: vtt, widget: file, required: false }
      - { label: Cuerpo, name: body, widget: markdown }
