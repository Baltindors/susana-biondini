# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Baltindors/susana-biondini
  branch: main

media_folder: /public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Escritos
    label_singular: Escrito
    folder: /src/content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Fecha de publicación, name: date, widget: datetime }
      - { label: Descripción, name: description, widget: text }
      - { label: "Audio MP3", name: audio, widget: file, required: false }
      - { label: "Marcas de tiempo del audio (.vtt)", name: vtt, widget: file, required: false }
      - { label: Cuerpo, name: body, widget: markdown }

  # Sveltia single-file collection: JSON must be a top-level array of entry objects.
  - name: galeria
    label: Galería
    label_singular: Imagen
    file: /src/content/gallery.json
    identifier_field: alt
    media_folder: /public/images/gallery
    public_folder: /images/gallery
    create: true
    delete: true
    summary: "{{alt}}"
    fields:
      - { label: Imagen, name: image, widget: image }
      - { label: Texto alternativo, name: alt, widget: string }
      - { label: Texto explicativo, name: caption, widget: text, required: false }
